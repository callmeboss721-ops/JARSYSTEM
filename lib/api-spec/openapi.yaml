      type: object
      required: [business_date, account, received_total, sent_total, daily_limit, remaining_limit, over_limit, transfers]
      properties:
        business_date: { type: string }
        account: { anyOf: [{ $ref: "#/components/schemas/BankAccount" }, { type: "null" }] }
        received_total: { type: number, minimum: 0 }
        sent_total: { type: number, minimum: 0 }
        daily_limit: { anyOf: [{ type: number, minimum: 0 }, { type: "null" }] }
        remaining_limit: { anyOf: [{ type: number }, { type: "null" }] }
        over_limit: { type: boolean }
        transfers:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/BankTransfer" }
