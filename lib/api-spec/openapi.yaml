      type: object
      required: [today]
      properties:
        today: { $ref: "#/components/schemas/BankToday" }
    OwnerBanking:
      type: object
      required: [accounts, today]
      properties:
        accounts:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/BankAccount" }
        today: { $ref: "#/components/schemas/BankToday" }
    BankAccountInput:
      type: object
      required: [bank_name, account_number, account_holder, daily_limit]
      properties:
        bank_name: { type: string, minLength: 1, maxLength: 80 }
        account_number: { type: string, minLength: 6, maxLength: 24, pattern: "^[0-9 -]+$" }
        account_holder: { type: string, minLength: 1, maxLength: 100 }
        daily_limit: { type: string, minLength: 1, maxLength: 12, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
    BankAccountUpdateInput:
      allOf:
        - $ref: "#/components/schemas/BankAccountInput"
        - type: object
          required: [is_active]
          properties:
            is_active: { type: boolean }
    BankTransferInput:
      type: object
      required: [direction, amount, request_id]
      properties:
        direction: { type: string, enum: [in, out] }
        amount: { type: string, minLength: 1, maxLength: 12, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        note: { type: string, maxLength: 160 }
        request_id: { type: string, format: uuid }
