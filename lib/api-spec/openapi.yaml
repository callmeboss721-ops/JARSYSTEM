      required: [members, kratom_members, cannabis_members, today_points_issued, today_sales, total_sales, today_visits, total_visits, today_redemptions, redemptions, by_formula]
      properties:
        members: { type: integer, description: "Active non-demo member count across the store" }
        kratom_members: { type: integer, description: "Active non-demo members with at least one recorded kratom sale" }
        cannabis_members: { type: integer, description: "Active non-demo members with at least one recorded cannabis purchase" }
        today_points_issued: { type: integer, description: "Positive kratom and cannabis points issued today in Bangkok time" }
        today_sales: { type: number }
        total_sales: { type: number }
        today_visits: { type: integer }
        total_visits: { type: integer }
        today_redemptions: { type: integer, description: "Confirmed 10-point free redemptions today across both categories" }
