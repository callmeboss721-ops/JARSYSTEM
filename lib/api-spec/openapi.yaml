openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Jaguar Kratom loyalty API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /loyalty/register:
    post:
      operationId: registerMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Member registered and session cookie issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/login:
    post:
      operationId: loginMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberLogin" }
      responses:
        "200":
          description: Member signed in and session cookie issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/logout:
    post:
      operationId: logoutMember
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /loyalty/session:
    get:
      operationId: getMemberSession
      responses:
        "200":
          description: Whether a valid member session exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberSessionStatus" }
  /loyalty/card:
    get:
      operationId: getMemberCard
      responses:
        "200":
          description: Current member card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/nickname:
    patch:
      operationId: updateMemberNickname
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberNicknameInput" }
      responses:
        "200":
          description: Member nickname updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/cannabis-card:
    get:
      operationId: getCannabisMemberCard
      responses:
        "200":
          description: Current member cannabis stamp card and recent activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CannabisCard" }
  /loyalty/rewards:
    get:
      operationId: listRewards
      responses:
        "200":
          description: Active rewards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reward" }
  /loyalty/redemptions:
    get:
      operationId: listMemberRedemptions
      responses:
        "200":
          description: Current member redemption history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Redemption" }
    post:
      operationId: requestRedemption
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedemptionInput" }
      responses:
        "201":
          description: Pending redemption, points deducted only on staff confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
  /loyalty/activity:
    get:
      operationId: listMemberActivity
      responses:
        "200":
          description: Recent points transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PointTransaction" }
  /loyalty/health:
    get:
      operationId: getLoyaltyHealth
      responses:
        "200":
          description: Store availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyHealth" }
  /loyalty/qr:
    get:
      operationId: getMemberQr
      responses:
        "200":
          description: Opaque private staff-scan credential; never a member login code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberQr" }
  /loyalty/sales:
    get:
      operationId: listMemberSales
      responses:
        "200":
          description: Five most recent purchases for the signed-in member
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sale" }
  /loyalty/staff/login:
    post:
      operationId: loginStaff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinLogin" }
      responses:
        "200":
          description: Staff session cookie issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /loyalty/staff/logout:
    post:
      operationId: logoutStaff
      responses:
        "200":
          description: Staff session cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /loyalty/staff/security:
    get:
      operationId: getStaffSecurity
      responses:
        "200":
          description: Staff session and PIN setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSecurityState" }
  /loyalty/staff/pin:
    post:
      operationId: changeStaffPin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPinInput" }
      responses:
        "200":
          description: PIN replaced and staff sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /loyalty/staff/member:
    get:
      operationId: findMember
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{4,6}[A-Za-z0-9]$" }
        - in: query
          name: qr_token
          required: false
          schema: { type: string, pattern: "^(JAGUAR1:)?[0-9a-f]{64}$" }
      responses:
        "200":
          description: Exact member lookup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/staff/cannabis-card:
    get:
      operationId: getStaffCannabisCard
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{4,6}[A-Za-z0-9]$" }
        - in: query
          name: qr_token
          required: false
          schema: { type: string, pattern: "^(JAGUAR1:)?[0-9a-f]{64}$" }
      responses:
        "200":
          description: Cannabis stamps for a scanned or searched member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CannabisCard" }
  /loyalty/staff/members:
    get:
      operationId: listStaffMembers
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Active member directory, capped at 200
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberCard" }
    post:
      operationId: createStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberAccountInput" }
      responses:
        "201":
          description: Member and zero balance created atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/staff/stamp:
    post:
      operationId: recordStaffSale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleInput" }
      responses:
        "200":
          description: Exactly one point and a recorded sale, idempotent by request_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/staff/points:
    post:
      operationId: creditStaffPoints
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPointCreditInput" }
      responses:
        "200":
          description: Idempotent staff point credit recorded in the existing points ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/staff/member-sales:
    get:
      operationId: listStaffSales
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{4,6}[A-Za-z0-9]$" }
      responses:
        "200":
          description: Today's sale records for the selected member
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffSale" }
  /loyalty/uploads/request-url:
    post:
      operationId: requestLoyaltyUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateUploadRequest" }
      responses:
        "200":
          description: Short-lived private upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateUploadUrl" }
  /loyalty/staff/sales/{id}/slip:
    get:
      operationId: getStaffSaleSlip
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private image attachment for an authorized staff member
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
    patch:
      operationId: updateStaffSaleSlip
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffSaleSlipInput" }
      responses:
        "200":
          description: Updated private attachment without changing sale totals or loyalty points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSaleSlipResult" }
  /loyalty/owner/sales/{id}/slip:
    get:
      operationId: getOwnerSaleSlip
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private image attachment for the authorized owner
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
  /loyalty/staff/sales/{id}:
    patch:
      operationId: correctStaffSale
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffSaleCorrectionInput" }
      responses:
        "200":
          description: Corrected sale and recomputed member points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSaleCorrectionResult" }
  /loyalty/staff/cannabis-stamp:
    post:
      operationId: addCannabisStamps
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CannabisStampInput" }
      responses:
        "200":
          description: One stamp per purchased gram, idempotent by request_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CannabisCard" }
  /loyalty/staff/cannabis-transactions/{id}:
    patch:
      operationId: correctStaffCannabisTransaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CannabisSaleCorrectionInput" }
      responses:
        "200":
          description: Corrected cannabis purchase and recomputed carried points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CannabisCard" }
  /loyalty/staff/cannabis-redeem:
    post:
      operationId: redeemCannabisAtCounter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CannabisRedeemInput" }
      responses:
        "200":
          description: Redeem 10 cannabis stamps for one free gram
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CannabisCard" }
  /loyalty/staff/redeem:
    post:
      operationId: redeemAtCounter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CounterRedemptionInput" }
      responses:
        "200":
          description: Idempotent ten-point redemption and updated member card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounterRedemption" }
  /loyalty/staff/rewards:
    get:
      operationId: listStaffRewards
      responses:
        "200":
          description: Staff reward availability
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reward" }
  /loyalty/staff/banking/today:
    get:
      operationId: getStaffBanking
      responses:
        "200":
          description: Today's receiving account, daily limit and transfer ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffBanking" }
  /loyalty/staff/banking/transfers:
    post:
      operationId: recordStaffBankTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransferInput" }
      responses:
        "201":
          description: Transfer entry recorded idempotently in the active Bangkok-day account ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffBanking" }
  /loyalty/staff/banking/transfers/{id}:
    patch:
      operationId: correctStaffBankTransfer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransferCorrectionInput" }
      responses:
        "200":
          description: Corrected today's transfer and refreshed ledger totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffBanking" }
  /loyalty/staff/redemptions:
    get:
      operationId: listPendingRedemptions
      responses:
        "200":
          description: Pending redemptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Redemption" }
  /loyalty/staff/redemptions/recent:
    get:
      operationId: listRecentStaffRedemptions
      responses:
        "200":
          description: Today's recent pending and confirmed redemptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Redemption" }
  /loyalty/staff/redemptions/{id}:
    patch:
      operationId: correctStaffRedemption
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffRedemptionCorrectionInput" }
      responses:
        "200":
          description: Corrected reward record and adjusted points when already confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
  /loyalty/staff/redemptions/{id}/confirm:
    post:
      operationId: confirmRedemption
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Atomic confirmation, balance deduction and ledger entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
  /loyalty/owner/login:
    post:
      operationId: loginOwner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinLogin" }
      responses:
        "200":
          description: Owner-only session cookie issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /loyalty/owner/logout:
    post:
      operationId: logoutOwner
      responses:
        "200":
          description: Owner session cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /loyalty/owner/security:
    get:
      operationId: getOwnerSecurity
      responses:
        "200":
          description: Both PIN setup states, never the PIN values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerSecurityState" }
  /loyalty/owner/features/cannabis-points:
    patch:
      operationId: updateCannabisPointsFeature
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CannabisPointsFeatureInput" }
      responses:
        "200":
          description: Cannabis point earning setting updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CannabisPointsFeatureState" }
  /loyalty/owner/pins:
    post:
      operationId: changeOwnerPins
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerPinInput" }
      responses:
        "200":
          description: Selected PINs replaced and owner session cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /loyalty/owner/summary:
    get:
      operationId: getOwnerSummary
      responses:
        "200":
          description: Persisted sales, points, redemptions, category member counts and Bangkok-day totals excluding demo data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerSummary" }
  /loyalty/owner/audit-log:
    get:
      operationId: getOwnerAuditLog
      responses:
        "200":
          description: Latest 25 point, sale, redemption and correction events excluding demo members
          content:
            application/json:
              schema:
                type: array
                maxItems: 25
                items: { $ref: "#/components/schemas/OwnerAuditEntry" }
  /loyalty/owner/banking:
    get:
      operationId: getOwnerBanking
      responses:
        "200":
          description: Saved bank accounts and today's transfer ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerBanking" }
  /loyalty/owner/banking/accounts:
    post:
      operationId: createOwnerBankAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "201":
          description: Receiving account saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
  /loyalty/owner/banking/accounts/{id}:
    patch:
      operationId: updateOwnerBankAccount
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountUpdateInput" }
      responses:
        "200":
          description: Bank account details updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
  /loyalty/owner/banking/accounts/{id}/select-today:
    post:
      operationId: selectOwnerBankAccountForToday
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Receiving account selected for the current Bangkok business day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerBanking" }
  /loyalty/owner/members:
    get:
      operationId: listOwnerMembers
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Member directory excluding deleted accounts, capped at 200
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberCard" }
    post:
      operationId: createOwnerMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberAccountInput" }
      responses:
        "201":
          description: Member and zero balance created atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
  /loyalty/owner/members/{id}:
    delete:
      operationId: deactivateOwnerMember
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Member deactivated while preserving sales and redemption history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /loyalty/owner/rewards:
    get:
      operationId: listOwnerRewards
      responses:
        "200":
          description: Active and inactive rewards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reward" }
    post:
      operationId: createOwnerReward
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardInput" }
      responses:
        "201":
          description: Reward created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
  /loyalty/owner/rewards/{id}:
    patch:
      operationId: updateOwnerReward
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardStatusInput" }
      responses:
        "200":
          description: Reward availability updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
  /loyalty/owner/products:
    get:
      operationId: listOwnerProducts
      responses:
        "200":
          description: Private product catalog, independent of sales and loyalty calculations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerProduct" }
    post:
      operationId: createOwnerProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOwnerProductInput" }
      responses:
        "201":
          description: Product added to the separate catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProduct" }
  /loyalty/owner/products/{id}:
    patch:
      operationId: updateOwnerProduct
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOwnerProductInput" }
      responses:
        "200":
          description: Updated catalog product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProduct" }
  /loyalty/owner/products/{id}/image:
    get:
      operationId: getOwnerProductImage
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private product reference image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
  /loyalty/owner/pending:
    get:
      operationId: listOwnerPending
      responses:
        "200":
          description: Pending customer reward requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Redemption" }
  /loyalty/owner/redemptions/{id}/confirm:
    post:
      operationId: confirmOwnerRedemption
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Atomic confirmation, balance deduction and ledger entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Success:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    MemberInput:
      type: object
