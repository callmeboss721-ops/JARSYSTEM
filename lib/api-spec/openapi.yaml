        reward_id: { type: string }
        reward_name: { type: string }
        points_spent: { type: integer }
        status: { type: string }
        created_at: { type: string }
        corrected: { type: boolean }
    MemberAccountInput:
      type: object
      required: [name, member_code, phone, nickname]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        member_code: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{4,6}[A-Za-z0-9]$" }
        phone: { type: string, minLength: 9, maxLength: 20 }
        nickname: { type: string, minLength: 2, maxLength: 20 }
    SaleInput:
      type: object
      required: [bottle_count, formula, request_id]
