      type: object
      required: [id, event_type, member_code, member_label, description, points_delta, status, created_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string, enum: [sale, cannabis, redemption, points, correction] }
        member_code: { type: string, maxLength: 8 }
        member_label: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 240 }
