        bank_name: { type: string }
        account_number: { type: string, pattern: "^[0-9]{6,20}$" }
        account_holder: { type: string }
        daily_limit: { type: number, minimum: 0 }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
