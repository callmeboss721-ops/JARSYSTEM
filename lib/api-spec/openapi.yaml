        display_name: { type: string }
        nickname: { type: ["string", "null"], minLength: 2, maxLength: 20 }
        phone_masked: { type: ["string", "null"], maxLength: 24 }
        balance: { type: integer, minimum: 0 }
        lifetime_earned: { type: integer, minimum: 0 }
        lifetime_redeemed: { type: integer, minimum: 0 }
        grams_remainder: { type: integer, minimum: 0, maximum: 99 }
        recent_transactions:
